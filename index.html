<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flashcards Study</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>📚 Flashcards Study</h1>
        <p>Click on a card to reveal the answer</p>
    </header>

    <!-- MATH SECTION -->
    <h2>📐 Math</h2>
    <div class="container">

        <label class="card">
            <input type="checkbox">
            <div class="inner">
                <div class="front">What is 5 + 3?</div>
                <div class="back">8</div>
            </div>
        </label>

        <label class="card">
            <input type="checkbox">
            <div class="inner">
                <div class="front">Square root of 16?</div>
                <div class="back">4</div>
            </div>
        </label>

    </div>

    <!-- SCIENCE SECTION -->
    <h2>🔬 Science</h2>
    <div class="container">

        <label class="card">
            <input type="checkbox">
            <div class="inner">
                <div class="front">Water formula?</div>
                <div class="back">H₂O</div>
            </div>
        </label>

        <label class="card">
            <input type="checkbox">
            <div class="inner">
                <div class="front">Planet we live on?</div>
                <div class="back">Earth</div>
            </div>
        </label>

    </div>

    <!-- GENERAL KNOWLEDGE -->
    <h2>🌍 General Knowledge</h2>
    <div class="container">

        <label class="card">
            <input type="checkbox">
            <div class="inner">
                <div class="front">Capital of Rwanda?</div>
                <div class="back">Kigali</div>
            </div>
        </label>

    </div>

    <footer>
        <p>Made by a future developer 💻🔥</p>
    </footer>

</body>
</html>
