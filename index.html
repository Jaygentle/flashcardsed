<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flashcards Study</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>📚 Flashcards Study</h1>

    <div class="container">

        <div class="card">
            <div class="inner">
                <div class="front">
                    What is 5 + 3?
                </div>
                <div class="back">
                    8
                </div>
            </div>
        </div>

        <div class="card">
            <div class="inner">
                <div class="front">
                    Capital of Rwanda?
                </div>
                <div class="back">
                    Kigali
                </div>
            </div>
        </div>

        <div class="card">
            <div class="inner">
                <div class="front">
                    Water formula?
                </div>
                <div class="back">
                    H₂O
                </div>
            </div>
        </div>

    </div>

</body>
</html>
